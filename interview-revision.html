<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Interview Revision · Ahmed OS</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{background:#080b10;color:#edf3fb;margin:0}main{max-width:1000px;margin:auto;padding:22px 14px 80px}h1{font-size:clamp(25px,5vw,40px);margin:8px 0}h2{font-size:19px}p{color:#aab9cc;line-height:1.7}.muted{font-size:13px}.bar,.filters,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.bar{justify-content:space-between}.chip,button,select,input{background:#101c2c;border:1px solid #2b3d52;color:#e8f2ff;padding:11px 13px;border-radius:11px;font:inherit}.chip{font-size:12px}button{cursor:pointer}button:hover{border-color:#65baff}button.active{background:#17406a}input{min-width:190px;flex:1}.progress{background:#1a2939;border-radius:30px;height:9px;overflow:hidden;margin:17px 0}.progress>div{height:100%;background:#67c7ff;width:0}.card{border:1px solid #24354a;background:#0e1724;padding:18px;border-radius:16px;margin:13px 0}.card h2{margin:0 0 8px}.card small,.eyebrow{color:#72c2ff}details{background:#111d2d;border-radius:10px;padding:12px;margin:10px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-x:auto;background:#070e17;padding:13px;border-radius:9px;color:#c1e6ff;direction:ltr;text-align:left;font-size:12px}blockquote{border-left:3px solid #65baff;padding:0 12px;margin:10px 0;color:#dceaff}.arabic{direction:rtl;text-align:right;line-height:1.9}.empty{padding:30px;text-align:center}a{color:#8dd2ff}.actions{margin-top:14px}.question{border-top:1px solid #24354a;margin-top:15px;padding-top:15px}#cards{min-height:180px}@media(max-width:600px){.card{padding:14px}.filters>*{width:100%}.bar{align-items:stretch}}

.code-panel{border:1px solid #324b64;border-radius:12px;overflow:hidden;background:#080f19;margin-top:12px}.code-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:#14273b;border-bottom:1px solid #324b64;color:#a8d7ff;font-size:11px;letter-spacing:.05em}.copy-code{padding:6px 11px;font-size:12px;background:#183b5a;color:#e6f6ff;border:1px solid #426d92}.code-panel pre{background:transparent;margin:0;padding:17px 14px;white-space:pre;overflow-x:auto;line-height:1.65;tab-size:2;font-size:13px}.code-panel code{font-family:ui-monospace,SFMono-Regular,Consolas,Monaco,monospace}.code-keyword{color:#9ac8ff;font-weight:600}.code-string{color:#b6e2a7}.code-comment{color:#8097b0}@media(max-width:600px){.code-panel pre{font-size:12px;padding:12px}.code-header{padding:8px}}
</style></head><body><main><div class="bar"><div><small class="eyebrow">AHMED OS / 3-DAY INTERVIEW PREP</small><h1>Interview Revision</h1><p class="muted">Mid-Level Full-Stack · .NET + Angular · Concepts, answers, code & quick review</p></div><span class="chip" id="counter">0 mastered</span></div><div class="progress" aria-label="Topic mastery"><div id="progress"></div></div><div class="filters"><input id="search" type="search" placeholder="Search a concept or question..." aria-label="Search revision content"><select id="day" aria-label="Day filter"><option value="all">All days</option><option value="1">Day 1 · Backend / SQL</option><option value="2">Day 2 · Angular / Architecture</option><option value="3">Day 3 · Practice</option></select><select id="status" aria-label="Review status"><option value="all">All statuses</option><option value="new">Not started</option><option value="learning">Learning</option><option value="review">Needs review</option><option value="mastered">Mastered</option></select><button id="quick" aria-pressed="false">⚡ Quick review</button></div><div id="cards"></div><p class="muted">Progress is saved locally in this browser, not synced between devices. Examples are for interview practice, not production drop-in code.</p></main><script src="interview-revision.js"></script></body></html>
